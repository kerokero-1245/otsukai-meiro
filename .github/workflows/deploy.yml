name: Web を GitHub Pages へデプロイ

# main への push と PR で typecheck と Web の書き出しを検査し、
# typecheck と書き出しを通ったときだけ（main の push と手動実行のみ）GitHub Pages へ公開する。
# 権限とデプロイの列（concurrency の pages）は deploy ジョブだけに持たせ、PR の検査には書き込み権限を渡さず、デプロイの列にも並ばせない。
# ci ジョブは ref ごとの別の列（ci-<ref>）に並べ、同じブランチ・PR に新しい push が来たら古い検査を止める。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: Node を .nvmrc の版で用意
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 整形の検査（prettier --check）
        run: npm run format:check

      - name: 型チェック（tsc --noEmit）
        run: npm run typecheck

      - name: テスト（node --test）
        run: npm test

      - name: Web を書き出し（サブパス /otsukai-meiro/ 前提）
        # EXPO_BASE_URL は app.config.js が experiments.baseUrl に反映する。
        # これによりビルド時のみサブパスが適用され、ローカル開発には影響しない。
        env:
          EXPO_BASE_URL: /otsukai-meiro
        run: npx expo export --platform web

      - name: Jekyll 無効化（_expo などアンダースコア始まりを配信するため）
        run: touch dist/.nojekyll

      - name: 成果物をアップロード
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 設定（未有効なら有効化）
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v5
