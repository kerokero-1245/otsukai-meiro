<!doctype html>
<!--
  Web 書き出しの HTML の型。Expo は public/index.html があればこれを使い、題名の置き場所に app.json の name、
  head の終わりに favicon、body の終わりに JS を差し込む（置き換えは文字列の最初の一致なので、
  このコメントに置き場所の記号や終了タグをそのまま書かないこと）。public/ のほかのファイルは書き出しにそのままコピーされる。
  href は相対パスで書く（GitHub Pages では /otsukai-meiro/ の下、手元の開発サーバでは / の下で配るため）。
  og:image だけは SNS が読むので絶対 URL。
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <meta
      name="description"
      content="4さいの はじめての プログラミング。やじるしで ひよこを ゴールまで つれて いこう。"
    />

    <!-- スマホ表示・ホーム画面に追加 -->
    <meta name="theme-color" content="#FFF6E5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="おつかいめいろ" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />

    <!-- SNS で共有したときの見出し（OGP） -->
    <meta property="og:title" content="おつかいめいろ" />
    <meta
      property="og:description"
      content="4さいの はじめての プログラミング。やじるしで ひよこを ゴールまで つれて いこう。"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://kerokero-1245.github.io/otsukai-meiro/"
    />
    <meta
      property="og:image"
      content="https://kerokero-1245.github.io/otsukai-meiro/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* 読み込み中（JS が動く前）も白一色にしない。アプリの地の色 colors.bg（src/theme.ts）と同じクリーム */
        background-color: #fff6e5;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> JavaScript を オンに すると あそべます。 </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
